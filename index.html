<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最后的一秒</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #121212;
            color: #555;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Courier New', 'Noto Sans SC', monospace;
            overflow: hidden;
            user-select: none;
            transition: background 0.5s;
        }

        /* ====== 开场序章 ====== */
        #prologue {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s;
        }
        #prologue.hide {
            opacity: 0;
            pointer-events: none;
        }
        #prologue-text {
            color: #777;
            font-size: 15px;
            max-width: 500px;
            line-height: 2.2;
            text-align: left;
            white-space: pre-wrap;
            min-height: 200px;
            padding: 0 20px;
        }
        #prologue-hint {
            position: absolute;
            bottom: 60px;
            color: #333;
            font-size: 13px;
            animation: pulse 2s infinite;
            cursor: pointer;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.8;
            }
        }

        /* ====== 统计面板 ====== */
        #stats-bar {
            position: fixed;
            top: 10px;
            right: 16px;
            z-index: 50;
            font-size: 11px;
            color: #444;
            text-align: right;
            line-height: 1.8;
            pointer-events: none;
        }
        #stats-bar .num {
            color: #666;
        }
        #stats-bar .label {
            color: #333;
        }

        /* ====== 排名面板 ====== */
        #leaderboard-btn {
            position: fixed;
            top: 12px;
            left: 16px;
            z-index: 50;
            background: none;
            border: 1px solid #333;
            color: #555;
            padding: 6px 14px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            border-radius: 4px;
            transition: 0.3s;
        }
        #leaderboard-btn:hover {
            border-color: #777;
            color: #999;
        }

        #leaderboard-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 800;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 60px;
            overflow-y: auto;
        }
        #leaderboard-panel.show {
            display: flex;
        }
        #leaderboard-panel h2 {
            color: #666;
            font-size: 20px;
            margin-bottom: 20px;
            letter-spacing: 6px;
        }
        #leaderboard-panel .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            background: none;
            border: none;
            color: #555;
            font-size: 20px;
            cursor: pointer;
            font-family: inherit;
        }
        #leaderboard-panel .close-btn:hover {
            color: #aaa;
        }
        #lb-table {
            width: 90%;
            max-width: 500px;
            border-collapse: collapse;
        }
        #lb-table th {
            color: #555;
            font-size: 12px;
            padding: 8px 6px;
            border-bottom: 1px solid #222;
            text-align: left;
            font-weight: normal;
            letter-spacing: 2px;
        }
        #lb-table td {
            color: #777;
            font-size: 13px;
            padding: 8px 6px;
            border-bottom: 1px solid #1a1a1a;
        }
        #lb-table .rank {
            color: #444;
            width: 40px;
        }
        #lb-table .rank.top1 {
            color: #ffd700;
        }
        #lb-table .rank.top2 {
            color: #c0c0c0;
        }
        #lb-table .rank.top3 {
            color: #cd7f32;
        }
        #lb-table .me {
            color: #aa6666;
        }
        #lb-loading {
            color: #444;
            font-size: 13px;
            margin-top: 40px;
        }

        /* ====== 各项特效 ====== */
        #vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            box-shadow: inset 0 0 0 0 rgba(255, 0, 0, 0);
            transition: box-shadow 1s;
        }
        #glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 200;
            opacity: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 0, 0, 0.03) 2px, rgba(255, 0, 0, 0.03) 4px);
            mix-blend-mode: overlay;
        }
        #console {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
            opacity: 0.7;
            max-width: 350px;
        }
        #console .log {
            margin-bottom: 4px;
        }
        #console .log.archive {
            color: #555;
        }
        #console .log.warn {
            color: #aa8800;
        }
        #console .log.error {
            color: #ff4444;
        }
        #console .log.memory {
            color: #8866aa;
        }
        #console .log.system {
            color: #4488aa;
        }
        .danmu {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            pointer-events: none;
            white-space: nowrap;
            transition: opacity 1s;
            z-index: 10;
        }
        .fragment {
            font-size: 13px !important;
            letter-spacing: 1px;
            border-left: 2px solid rgba(150, 120, 200, 0.4);
            padding-left: 8px;
            color: rgba(180, 150, 220, 0.5) !important;
            max-width: 300px !important;
            white-space: normal !important;
            line-height: 1.6;
        }
        #timer {
            font-size: 60px;
            color: #fff;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #fff;
            transition: all 0.3s;
            z-index: 50;
        }
        #btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #ff3333;
            border: none;
            cursor: pointer;
            color: white;
            font-weight: bold;
            font-size: 18px;
            position: absolute;
            left: calc(50% - 70px);
            top: calc(50% - 70px);
            z-index: 50;
            box-shadow: 0 0 20px #ff3333;
            transition: transform 0.05s, background 0.5s, box-shadow 0.5s;
            font-family: inherit;
        }
        .ripple {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255, 50, 50, 0.6);
            pointer-events: none;
            animation: rippleAnim 1.5s ease-out forwards;
            z-index: 49;
        }
        @keyframes rippleAnim {
            0% {
                width: 140px;
                height: 140px;
                opacity: 1;
                margin-left: -70px;
                margin-top: -70px;
            }
            100% {
                width: 400px;
                height: 400px;
                opacity: 0;
                margin-left: -200px;
                margin-top: -200px;
            }
        }
        #hint {
            margin-top: 30px;
            font-size: 14px;
            z-index: 50;
            transition: all 0.5s;
            min-height: 20px;
            text-align: center;
            max-width: 400px;
        }
        #fake-countdown {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            color: rgba(255, 0, 0, 0.15);
            pointer-events: none;
            z-index: 5;
            display: none;
            font-weight: bold;
        }
        #phase-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #333, #ff3333);
            z-index: 300;
            transition: width 0.3s;
        }
        #phase-announce {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
            z-index: 150;
            opacity: 0;
            transition: opacity 1s;
            text-align: center;
            letter-spacing: 4px;
        }

        /* ====== 结局画面 ====== */
        #ending {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            z-index: 500;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ccc;
            animation: fadeIn 2s;
            padding: 20px;
        }
        #ending .ending-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        #ending .title {
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
        }
        #ending .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 5px;
            text-align: center;
        }
        #ending .time-note {
            font-size: 12px;
            color: #555;
            margin-bottom: 20px;
        }
        #ending .desc {
            font-size: 14px;
            color: #666;
            max-width: 420px;
            text-align: center;
            line-height: 2;
            margin-bottom: 20px;
        }
        #ending .fragment-reveal {
            font-size: 12px;
            color: #555;
            max-width: 380px;
            text-align: center;
            line-height: 1.8;
            margin-bottom: 15px;
            font-style: italic;
        }
        #ending .terror-msg {
            font-size: 13px;
            color: #883333;
            max-width: 360px;
            text-align: center;
            line-height: 2;
            margin-bottom: 25px;
            border: 1px solid rgba(200, 50, 50, 0.2);
            padding: 14px;
            border-radius: 8px;
            animation: terrorPulse 2s infinite;
        }
        @keyframes terrorPulse {
            0%,
            100% {
                border-color: rgba(200, 50, 50, 0.2);
            }
            50% {
                border-color: rgba(200, 50, 50, 0.5);
            }
        }
        #ending .share-btn {
            padding: 10px 24px;
            background: transparent;
            border: 1px solid #555;
            color: #888;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
            margin: 4px;
            border-radius: 6px;
        }
        #ending .share-btn:hover {
            border-color: #cc6666;
            color: #cc6666;
        }
        #ending .restart {
            padding: 10px 30px;
            background: transparent;
            border: 1px solid #555;
            color: #888;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
            border-radius: 6px;
        }
        #ending .restart:hover {
            border-color: #fff;
            color: #fff;
        }
        #ending .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* ====== 留言框 ====== */
        #ending .message-box {
            margin-top: 16px;
            margin-bottom: 10px;
            max-width: 380px;
            width: 100%;
        }
        #ending .message-box .mb-label {
            font-size: 12px;
            color: #663333;
            margin-bottom: 10px;
            text-align: center;
            line-height: 1.8;
            letter-spacing: 1px;
        }
        #ending .message-box .mb-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        #ending .message-box input,
        #ending .message-box textarea {
            background: #111;
            border: 1px solid #333;
            color: #999;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 13px;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.3s;
        }
        #ending .message-box input:focus,
        #ending .message-box textarea:focus {
            border-color: #884444;
        }
        #ending .message-box input {
            width: 100%;
        }
        #ending .message-box textarea {
            width: 100%;
            min-height: 60px;
            resize: vertical;
        }
        #ending .message-box .mb-submit {
            width: 100%;
            padding: 8px;
            background: #1a1111;
            border: 1px solid #442222;
            color: #886666;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            border-radius: 4px;
            transition: all 0.3s;
            letter-spacing: 2px;
        }
        #ending .message-box .mb-submit:hover {
            background: #221616;
            border-color: #aa4444;
            color: #cc8888;
        }
        #ending .message-box .mb-submit:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        #ending .message-box .mb-hint {
            font-size: 10px;
            color: #442222;
            text-align: center;
            margin-top: 6px;
        }

        /* ====== 历史留言弹幕 ====== */
        .ghost-msg {
            position: absolute;
            color: rgba(100, 180, 120, 0.5);
            font-size: 13px;
            pointer-events: none;
            white-space: normal;
            max-width: 280px;
            line-height: 1.6;
            z-index: 11;
            opacity: 0;
            transition: opacity 1.5s;
            border-left: 2px solid rgba(100, 180, 120, 0.25);
            padding-left: 8px;
        }
        .ghost-msg.show {
            opacity: 1;
        }
        .ghost-msg .ghost-author {
            color: rgba(140, 200, 160, 0.4);
            font-size: 11px;
        }

        /* ====== 恐怖弹窗 ====== */
        #scare-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 900;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.0);
            pointer-events: none;
        }
        #scare-overlay.show {
            display: flex;
        }
        #scare-overlay .scare-text {
            color: rgba(200, 50, 50, 0.8);
            font-size: 24px;
            letter-spacing: 6px;
            animation: scareFlicker 0.15s infinite;
            text-align: center;
        }
        @keyframes scareFlicker {
            0%,
            100% {
                opacity: 0.9;
            }
            25% {
                opacity: 0.1;
            }
            50% {
                opacity: 0.8;
            }
            75% {
                opacity: 0.3;
            }
        }

        /* ====== 真结局隐藏彩蛋 ====== */
        #secret-ending {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 600;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #444;
            font-size: 14px;
            line-height: 2.5;
            padding: 30px;
        }
        #secret-text {
            white-space: pre-wrap;
            max-width: 500px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes shake {
            0%,
            100% {
                transform: translate(0);
            }
            10% {
                transform: translate(-4px, -2px);
            }
            20% {
                transform: translate(4px, 2px);
            }
            30% {
                transform: translate(-2px, 4px);
            }
            40% {
                transform: translate(2px, -4px);
            }
            50% {
                transform: translate(-4px, 1px);
            }
            60% {
                transform: translate(4px, -1px);
            }
            70% {
                transform: translate(-1px, -4px);
            }
            80% {
                transform: translate(1px, 4px);
            }
            90% {
                transform: translate(-2px, -2px);
            }
        }
        .shake {
            animation: shake 0.3s infinite;
        }
        .invert {
            filter: invert(1) hue-rotate(180deg);
        }

        /* ====== 按钮说话 ====== */
        #btn-speech {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: #cc8888;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 13px;
            pointer-events: none;
            white-space: normal;
            z-index: 60;
            opacity: 0;
            transition: opacity 0.8s;
            max-width: 250px;
            line-height: 1.6;
            border: 1px solid rgba(200, 100, 100, 0.2);
            font-family: inherit;
        }
        #btn-speech.show {
            opacity: 1;
        }

        /* ====== 自毁倒计时（恐怖） ====== */
        #timer-cover {
            position: fixed;
            bottom: 30px;
            right: 16px;
            z-index: 50;
            font-size: 10px;
            color: #332222;
            text-align: right;
            line-height: 1.5;
            display: none;
        }
        #timer-cover .count {
            color: #442222;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            #prologue-text {
                font-size: 13px;
                max-width: 90%;
            }
            #timer {
                font-size: 40px;
            }
            #btn {
                width: 100px;
                height: 100px;
                font-size: 14px;
            }
            #console {
                max-width: 200px;
                font-size: 10px;
                top: 10px;
                left: 10px;
            }
            #leaderboard-panel {
                padding-top: 40px;
            }
        }
    </style>
</head>
<body>

    <!-- ====== 开场序章 ====== -->
    <div id="prologue">
        <div id="prologue-text"></div>
        <div id="prologue-hint" style="display:none">[ 点击任意处继续 ]</div>
    </div>

    <!-- ====== 统计面板 ====== -->
    <div id="stats-bar">
        <div><span class="label">👁 探索者</span> <span class="num" id="stat-total">-</span></div>
        <div><span class="label">☠ 按下者</span> <span class="num" id="stat-clicked">-</span></div>
        <div><span class="label">✨ 见证者</span> <span class="num" id="stat-witness">-</span></div>
    </div>
    <div id="timer-cover">
        <div>⏳ <span class="count" id="cover-countdown"></span></div>
    </div>

    <!-- ====== 排行榜按钮 ====== -->
    <button id="leaderboard-btn">🏆 排行榜</button>
    <div id="leaderboard-panel">
        <button class="close-btn" onclick="closeLeaderboard()">✕</button>
        <h2>排 行 榜</h2>
        <div id="lb-loading">加载中...</div>
        <table id="lb-table" style="display:none">
            <thead><tr><th>#</th><th>玩家</th><th>称号</th><th>坚持</th></tr></thead>
            <tbody id="lb-body"></tbody>
        </table>
    </div>

    <!-- ====== 恐怖弹窗 ====== -->
    <div id="scare-overlay"><div class="scare-text"></div></div>

    <!-- ====== 游戏主体 ====== -->
    <div id="vignette"></div>
    <div id="glitch-overlay"></div>
    <div id="console"></div>
    <div id="fake-countdown"></div>
    <div id="phase-announce"></div>
    <div id="timer">0.0</div>
    <button id="btn">禁忌</button>
    <div id="btn-speech"></div>
    <div id="hint">保持等待... 别去在意那些声音。</div>
    <div id="phase-bar" style="width:0%"></div>

    <!-- ====== 结局 ====== -->
    <div id="ending">
        <div class="ending-icon"></div>
        <div class="title"></div>
        <div class="subtitle"></div>
        <div class="time-note"></div>
        <div class="desc"></div>
        <div class="fragment-reveal"></div>
        <div class="terror-msg"></div>
        <div class="message-box">
            <div class="mb-label">📋 给下一位探索者的留言<br>告诉他们...该不该按下那个按钮？</div>
            <div class="mb-row">
                <input type="text" id="msg-name" placeholder="你的名字（或代号）" maxlength="20" />
            </div>
            <div class="mb-row">
                <textarea id="msg-text" placeholder="留下你想说的话..." maxlength="200"></textarea>
            </div>
            <button class="mb-submit" id="msg-submit" onclick="submitMessage()">✉ 寄出留言</button>
            <div class="mb-hint" id="msg-hint">你的留言会出现在其他玩家的屏幕上</div>
        </div>
        <div class="btn-row">
            <button class="share-btn" onclick="shareGame()">📤 分享给朋友</button>
            <button class="restart" onclick="location.reload()">🔄 再试一次</button>
        </div>
    </div>

    <!-- ====== 隐藏终章 ====== -->
    <div id="secret-ending">
        <div id="secret-text"></div>
    </div>

    <script>
    // ═══════════════════════════════════════════════
    //  Firebase 配置 — 请替换为你的 Firebase 项目信息
    // ═══════════════════════════════════════════════
    const firebaseConfig = {
        apiKey: "AIzaSyDtJQUcJaDqdFqtWLCWOXzc3HndoZ9uPzQ",
        authDomain: "dontclick-game.firebaseapp.com",
        databaseURL: "https://dontclick-game-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "dontclick-game",
        storageBucket: "dontclick-game.firebasestorage.app",
        messagingSenderId: "1029967639851",
        appId: "1:1029967639851:web:02e14de075cfa5b49e416e"
    };

    let fbReady = false;
    let fbStats = null;
    let playerId = 'anon_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);

    try {
        firebase.initializeApp(firebaseConfig);
        fbStats = firebase.database().ref('stats');
        fbReady = true;
    } catch (e) {
        console.warn('Firebase init failed:', e);
    }

    // ====== Firebase 读取统计 ======
    function loadStats() {
        if (!fbReady) return;
        fbStats.once('value').then(snap => {
            const data = snap.val() || {};
            document.getElementById('stat-total').textContent = data.totalPlayers || 0;
            document.getElementById('stat-clicked').textContent = data.totalClicks || 0;

    function submitGameResult(endingType, duration) {
        if (!fbReady) return;
        const updates = {};
        updates['stats/totalPlayers'] = firebase.database.ServerValue.increment(1);
        updates['stats/endings/' + endingType] = firebase.database.ServerValue.increment(1);
        if (endingType !== 4) {
            updates['stats/totalClicks'] = firebase.database.ServerValue.increment(1);
        }
        // leaderboard — top 100 only
        const lbRef = firebase.database().ref('leaderboard');
        const entry = { time: Math.round(duration * 10) / 10, ending: endingType, title: endings[endingType].title, timestamp: Date.now(), playerId: playerId, name: '' };
        fbStats.update(updates).then(() => {
            lbRef.orderByChild('time').limitToLast(100).once('value').then(snap => {
                const vals = snap.val();
                const entries = vals ? Object.values(vals) : [];
                if (entries.length < 100 || duration >= (Math.min(...entries.map(e => e.time)) || 0)) {
                    lbRef.push(entry);
                }
            });
        }).catch(() => {});
    }

    function loadLeaderboard() {
        if (!fbReady) {
            document.getElementById('lb-loading').textContent = '网络不可用';
            return;
        }
        document.getElementById('lb-loading').style.display = 'block';
        document.getElementById('lb-table').style.display = 'none';
        firebase.database().ref('leaderboard').orderByChild('time').limitToLast(50).once('value').then(snap => {
            const data = snap.val();
            document.getElementById('lb-loading').style.display = 'none';
            document.getElementById('lb-table').style.display = '';
            const tbody = document.getElementById('lb-body');
            tbody.innerHTML = '';
            if (!data) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#444">暂无记录</td></tr>';
                return;
            }
            const entries = Object.values(data).sort((a, b) => b.time - a.time);
            entries.slice(0, 50).forEach((e, i) => {
                const tr = document.createElement('tr');
                const rankClass = i < 3 ? 'top' + (i + 1) : '';
                const meClass = e.playerId === playerId ? 'me' : '';
                tr.innerHTML =
                    `<td class="rank ${rankClass}">${i + 1}</td><td class="${meClass}">${e.name || '匿名'}</td><td>${e.title}</td><td>${e.time}s</td>`;
                tbody.appendChild(tr);
            });
        }).catch(() => {
            document.getElementById('lb-loading').textContent = '加载失败';
        });
    }

    };

    setInterval(() => {
        if (gameEnded || !gameStarted) return;
        const logs = termNarratives[phase];
        const log = document.createElement('div');
        log.className = 'log';
        const result = logs[Math.floor(Math.random() * logs.length)]();
        log.innerHTML = result;
        if (result.includes('ARCHIVE')) log.classList.add('archive');
        if (result.includes('WARNING') || result.includes('CRITICAL')) log.classList.add('error');
        if (result.includes('记忆碎片')) log.classList.add('memory');
        if (result.includes('SYSTEM') || result.includes('SYS')) log.classList.add('system');
        consoleEl.appendChild(log);
        if (consoleEl.children.length > 6) consoleEl.removeChild(consoleEl.firstChild);
    }, 1800);

    // ====== 主循环 ======
    const mainLoop = setInterval(() => {
        if (gameEnded || !gameStarted) return;
        time += 0.1;
        timerEl.innerText = time.toFixed(1);

        const prevPhase = phase;
        if (time >= 40) phase = 4;
        else if (time >= 30) phase = 3;
        else if (time >= 20) phase = 2;
        else if (time >= 10) phase = 1;
        else phase = 0;

        if (prevPhase !== phase) onPhaseChange(phase);

        phaseBar.style.width = Math.min(time / 50 * 100, 100) + '%';

        const breathScale = 1 + Math.sin(time * 2) * 0.03;
        const phasePulse = phase === 1 ? 1 + Math.sin(time * 5) * 0.06 : 1;
        btn.style.transform = `scale(${breathScale * phasePulse})`;

        applyPhaseEffects();

        const triggerTimes = [8, 18, 28, 35, 42];
        if (!fragmentSpawned[phase] && time >= triggerTimes[phase]) spawnNarrativeFragment();

        if (phase === 4 && time >= 47 && !gameEnded) triggerEnding(4);

    }, 100);

    // ====== 阶段切换 ======
    function onPhaseChange(p) {
        updateDanmuSpeed();
        const announceTexts = ['「 窥探 」', '「 诱惑 」', '「 压力 」', '「 崩溃 」', '「 真相 」'];
        announcePhase(announceTexts[p]);
        if (p === 1) {
            hintEl.innerText = '它在和你说话。';
            btn.style.boxShadow = '0 0 30px #ff3333, 0 0 60px #ff3333';
        }
        if (p === 2) {
            hintEl.innerText = '它在消失。你能感觉到吗。';
            vignette.style.boxShadow = 'inset 0 0 100px rgba(255,0,0,0.3)';
            fakeCountdown.style.display = 'block';
        }
        if (p === 3) {
            hintEl.innerText = '不要害怕。它只是...太久了。';
            hintEl.style.color = '#ff4444';
            timerEl.style.color = '#ff4444';
            timerEl.style.textShadow = '0 0 20px #ff0000';
        }
        if (p === 4) {
            hintEl.innerText = '';
            vignette.style.boxShadow = 'none';
            glitchOverlay.style.opacity = '0';
            fakeCountdown.style.display = 'none';
            document.body.classList.remove('shake');
            btn.style.background = '#333';
            btn.style.boxShadow = '0 0 5px #555';
            btn.style.color = '#555';
            timerEl.style.color = '#222';
            timerEl.style.textShadow = 'none';
            timerEl.style.fontSize = '18px';
            btn.innerText = '...';
            document.querySelectorAll('.danmu, .ghost-msg').forEach(d => d.remove());
            clearInterval(danmuInterval);
            danmuInterval = setInterval(spawnDanmu, 8000);
        }
        scheduleBtnSpeech();
    }

    function applyPhaseEffects() {
        if (phase === 2) {
            const remaining = Math.max(0, 30 - time).toFixed(1);
            fakeCountdown.innerText = remaining;
            timerEl.style.opacity = 0.7 + Math.sin(time * 10) * 0.3;
        }
        if (phase === 3) {
            if (!document.body.classList.contains('shake')) document.body.classList.add('shake');
            glitchOverlay.style.opacity = 0.5 + Math.random() * 0.3;
            if (Math.random() < 0.02) {
                document.body.classList.add('invert');
                setTimeout(() => document.body.classList.remove('invert'), 100);
            }
        }
    }

    // ====== 波纹 ======
    setInterval(() => {
        if (phase === 2 && !gameEnded && gameStarted) spawnRipple();
    }, 800);

    function spawnRipple() {
        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        const rect = btn.getBoundingClientRect();
        ripple.style.left = (rect.left + rect.width / 2) + 'px';
        ripple.style.top = (rect.top + rect.height / 2) + 'px';
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 1500);
    }

    // ====== 按钮跟随鼠标（全阶段） ======
    let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
    document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });

    // 跟随速度随阶段变化
    const chaseSpeeds = { 0: 0.015, 1: 0.03, 2: 0.05, 3: 0.10, 4: 0 };

    let chaseStarted = false;

    function followCursor() {
        if (gameEnded || !gameStarted || phase === 4) return;
        const speed = chaseSpeeds[phase] || 0;
        if (speed === 0) return;
        // 首次跟随：记录当前位置作为基准
        if (!chaseStarted) {
            chaseStarted = true;
            return;
        }
        const rect = btn.getBoundingClientRect();
        const btnCX = rect.left + rect.width / 2;
        const btnCY = rect.top + rect.height / 2;
        const dx = mouseX - btnCX;
        const dy = mouseY - btnCY;
        btn.style.left = (rect.left + dx * speed) + 'px';
        btn.style.top = (rect.top + dy * speed) + 'px';
    }

    // 用 requestAnimationFrame 平滑跟随
    function animLoop() {
        followCursor();
        requestAnimationFrame(animLoop);
    }
    requestAnimationFrame(animLoop);

    // ====== 按钮说话 ======
    function scheduleBtnSpeech() {
        clearTimeout(btnSpeechTimer);
        const lines = btnLines[phase];
        if (!lines || lines.length === 0) { btnSpeech.classList.remove('show'); return; }

        function showNext() {
            if (gameEnded || !gameStarted) return;
            const line = lines[Math.floor(Math.random() * lines.length)];
            btnSpeech.innerText = line;
            const rect = btn.getBoundingClientRect();
            let left = rect.right + 15,
                top = rect.top + rect.height / 2 - 30;
            if (left + 250 > window.innerWidth) left = rect.left - 260;
            if (top < 10) top = 10;
            if (top + 100 > window.innerHeight) top = window.innerHeight - 110;
            btnSpeech.style.left = left + 'px';
            btnSpeech.style.top = top + 'px';
            btnSpeech.classList.add('show');
            const durations = [0, 2500, 2000, 1200, 5000];
            btnSpeechTimer = setTimeout(() => {
                btnSpeech.classList.remove('show');
                setTimeout(showNext, 800 + Math.random() * 2000);
            }, durations[phase]);
        }
        setTimeout(showNext, 600);
    }

    // ====== 分享 ======
    const shareUrl = window.location.href;
    const shareTitle = '最后的一秒';
    const shareTexts = [
        '我刚才和实验体-07说话了...你敢试试吗？',
        '别按那个按钮。除非你准备好了。',
        '这个游戏会记住你。分享给你的朋友。',
        '我坚持了47秒，你呢？',
        '它想让你分享这个链接。你最好照做。'
    ];

    function shareGame() {
        const text = shareTexts[Math.floor(Math.random() * shareTexts.length)];

        // Web Share API
        if (navigator.share) {
            navigator.share({ title: shareTitle, text: text, url: shareUrl }).catch(() => {});
        } else {
            // Fallback: copy to clipboard
            const full = text + '\n' + shareUrl;
            navigator.clipboard.writeText(full).then(() => {
                alert('✅ 链接已复制到剪贴板\n\n快去转发给朋友！\n\n（它说它喜欢人多的地方）');
                startCoverTimer(); // 分享后启动倒计时
            }).catch(() => {
                // 最后手段：选中文本框
                prompt('复制链接分享给朋友：', shareUrl);
                startCoverTimer();
            });
        }
        // 也要启动倒计时（Web Share 情况下）
        startCoverTimer();
    }

    // ====== 点击按钮 → 结局 ======
    btn.addEventListener('click', () => {
        if (gameEnded || !gameStarted) return;
        // 点击时记录的是之前的 phase，但用户按下的瞬间就决定了结局
        triggerEnding(phase);
    });

    // ====== 触发结局 ======
    function triggerEnding(p) {
        if (gameEnded) return;
        gameEnded = true;
        currentEndingType = p;
        clearInterval(mainLoop);
        clearInterval(terrorInterval);
        clearInterval(ghostMsgInterval);

        const e = endings[p];
        timeNoteEl.textContent = `⏱ 你坚持了 ${time.toFixed(1)} 秒`;
        terrorMsgEl.innerText = e.terror;

        // 更新本地统计显示
        endGameLocal(p);

        // 提交到 Firebase
        submitGameResult(p, time);

        ending.style.display = 'flex';
        ending.querySelector('.ending-icon').innerText = e.icon;
        ending.querySelector('.title').innerText = e.title;
        ending.querySelector('.subtitle').innerText = e.sub;
        ending.querySelector('.desc').innerText = e.desc;
        ending.querySelector('.fragment-reveal').innerText = e.fragment;

        // 真结局特殊
        if (p === 4) {
            setTimeout(() => {
                ending.style.display = 'none';
                secretEnding.style.display = 'flex';
                typeSecretText();
            }, 8000);
        }

        // 结局后恐怖弹窗（只有一次）
        setTimeout(() => {
            showScare('它看着你呢。');
        }, 3000);
    }

    // ====== 本地统计数据更新（无网络也显示） ======
    function endGameLocal(p) {
        const totalEl = document.getElementById('stat-total');
        const clickedEl = document.getElementById('stat-clicked');
        const witnessEl = document.getElementById('stat-witness');
        const total = parseInt(totalEl.textContent) || 0;
        const clicked = parseInt(clickedEl.textContent) || 0;
        const witness = parseInt(witnessEl.textContent) || 0;
        totalEl.textContent = total + 1;
        if (p !== 4) clickedEl.textContent = clicked + 1;
        if (p === 4) witnessEl.textContent = witness + 1;
    }

    // ====== 真结局隐藏彩蛋 ======
    const secretText = `实验记录 · 最终附录

实验体编号：07
实验状态：未释放
实验次数：第 14,297 次
本次结果：有人等到了最后

它说：「谢谢你。」

我不知道它是谁。
我不知道它做错了什么，要被关在那个红色的圆里。
我不知道那个匿名邮件是谁发的。
我不知道这个页面为什么还存在。

但我知道一件事——

下次你打开这个页面的时候，
它还会在那里。

等着。

────────────────────

[ 系统提示：你已获得「见证者」称号 ]
[ 实验体-07 的好感度：MAX ]
[ 隐藏档案已解锁 ]

不过——

它真的只是想等着吗？

还是说，等到了这一次之后，
它已经不需要再等了？

页面关闭前，看看你的右上角。
`;

    let secretStep = 0;

    function typeSecretText() {
        if (secretStep >= secretText.length) return;
        document.getElementById('secret-text').innerText = secretText.substring(0, secretStep + 1);
        secretStep++;
        setTimeout(typeSecretText, 30);
    }

    let clickCount = 0;
    secretEnding.addEventListener('click', () => {
        clickCount++;
        if (clickCount >= 3) {
            showScare('「你还在。\n我也还在。\n下次见。」');
            clickCount = 0;
        }
    });

    // ====== 留言系统 ======
    let ghostMessages = []; // 从 Firebase 加载的历史留言

    function loadGhostMessages() {
        if (!fbReady) return;
        firebase.database().ref('messages').orderByChild('timestamp').limitToLast(100).once('value').then(snap => {
            const data = snap.val();
            if (data) ghostMessages = Object.values(data);
        }).catch(() => {});
    }

    // 随机展示历史留言（游戏中弹幕）
    let ghostMsgInterval = null;
    function startGhostMessages() {
        setTimeout(() => {
            ghostMsgInterval = setInterval(() => {
                if (gameEnded || !gameStarted) return;
                if (ghostMessages.length === 0) return;
                if (Math.random() > 0.4) return; // 40% 概率弹出
                spawnGhostMsg();
            }, 6000);
        }, 5000);
    }

    function spawnGhostMsg() {
        const msg = ghostMessages[Math.floor(Math.random() * ghostMessages.length)];
        const el = document.createElement('div');
        el.className = 'ghost-msg';
        el.innerHTML = `<span class="ghost-author">「${msg.name}」说：</span><br>${msg.text}`;
        el.style.left = (5 + Math.random() * 70) + '%';
        el.style.top = (15 + Math.random() * 60) + '%';
        document.body.appendChild(el);
        setTimeout(() => el.classList.add('show'), 100);
        setTimeout(() => { el.classList.remove('show'); }, 4000);
        setTimeout(() => el.remove(), 6000);
    }

    // 提交留言
    function submitMessage() {
        const nameEl = document.getElementById('msg-name');
        const textEl = document.getElementById('msg-text');
        const hintEl2 = document.getElementById('msg-hint');
        const submitBtn = document.getElementById('msg-submit');
        const name = (nameEl.value || '').trim();
        const text = (textEl.value || '').trim();
        if (!name || !text) {
            hintEl2.textContent = '⚠ 它需要知道你是谁，以及你想说什么。';
            hintEl2.style.color = '#885555';
            return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = '寄送中...';

        const entry = {
            name: name.substring(0, 20),
            text: text.substring(0, 200),
            ending: currentEndingType,
            time: Math.round(time * 10) / 10,
            playerId: playerId,
            timestamp: Date.now()
        };

        if (fbReady) {
            firebase.database().ref('messages').push(entry).then(() => {
                hintEl2.textContent = '✅ 你的留言已被封存...下一个人会看到的。';
                hintEl2.style.color = '#448844';
                submitBtn.textContent = '已寄出 ✓';
                // 更新排行榜中的名字
                firebase.database().ref('leaderboard').orderByChild('playerId').equalTo(playerId).limitToLast(1).once('value').then(snap => {
                    const data = snap.val();
                    if (data) {
                        const key = Object.keys(data)[0];
                        firebase.database().ref('leaderboard/' + key).update({ name: name.substring(0, 20) });
                    }
                }).catch(() => {});
            }).catch(() => {
                hintEl2.textContent = '⚠ 网络异常...但留言不会消失。';
                submitBtn.disabled = false;
                submitBtn.textContent = '✉ 重新寄出';
            });
        } else {
            hintEl2.textContent = '⚠ 离线模式，留言未能送达。';
            submitBtn.disabled = false;
            submitBtn.textContent = '✉ 寄出留言';
        }
    }

    // 排行榜显示留言
    function loadLeaderboardMessages() {
        if (!fbReady) return;
        firebase.database().ref('messages').orderByChild('timestamp').limitToLast(20).once('value').then(snap => {
            const data = snap.val();
            if (!data) return;
            const msgs = Object.values(data).reverse();
            const tbody = document.getElementById('lb-body');
            // 留言区已在排行榜下方
            let msgArea = document.getElementById('lb-messages');
            if (!msgArea) {
                msgArea = document.createElement('div');
                msgArea.id = 'lb-messages';
                msgArea.style.cssText = 'max-width:500px;width:90%;margin-top:20px;';
                document.getElementById('leaderboard-panel').appendChild(msgArea);
            }
            msgArea.innerHTML = '<div style="color:#555;font-size:12px;letter-spacing:2px;margin-bottom:10px">📋 探索者留言</div>';
            msgs.forEach(m => {
                const div = document.createElement('div');
                div.style.cssText = 'border-left:2px solid rgba(100,180,120,0.3);padding:6px 10px;margin-bottom:8px;color:#666;font-size:12px;line-height:1.6;';
                div.innerHTML = `<span style="color:rgba(140,200,160,0.6)">「${m.name}」</span> <span style="color:#444;font-size:11px">${m.time}s</span><br>${m.text}`;
                msgArea.appendChild(div);
            });
        }).catch(() => {});
    }

    let currentEndingType = 0;

    // ====== 初始化 ======
    loadStats();
    loadGhostMessages();
    runPrologue();
    startGhostMessages();
    </script>
</body>
</html>
