<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆角 -->
  <rect width="64" height="64" rx="14" fill="#FFF4E6"/>

  <!-- 左耳 -->
  <path d="M14 22 L18 10 L26 18 Z" fill="#FFB570" stroke="#E89048" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M17 20 L19 14 L23 18 Z" fill="#FFB6B0"/>

  <!-- 右耳 -->
  <path d="M50 22 L46 10 L38 18 Z" fill="#FFB570" stroke="#E89048" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M47 20 L45 14 L41 18 Z" fill="#FFB6B0"/>

  <!-- 头部 -->
  <ellipse cx="32" cy="36" rx="20" ry="18" fill="#FFB570" stroke="#E89048" stroke-width="1.8"/>

  <!-- 头顶条纹（小橙猫花纹） -->
  <path d="M22 22 Q24 26 22 28" stroke="#E89048" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M42 22 Q40 26 42 28" stroke="#E89048" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M30 20 Q32 23 30 25" stroke="#E89048" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M34 20 Q32 23 34 25" stroke="#E89048" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- 左眼 -->
  <ellipse cx="25" cy="35" rx="3" ry="4" fill="#2C2C2C"/>
  <circle cx="26" cy="33.5" r="1" fill="#FFFFFF"/>
  <circle cx="24.5" cy="36" r="0.5" fill="#FFFFFF"/>

  <!-- 右眼 -->
  <ellipse cx="39" cy="35" rx="3" ry="4" fill="#2C2C2C"/>
  <circle cx="40" cy="33.5" r="1" fill="#FFFFFF"/>
  <circle cx="38.5" cy="36" r="0.5" fill="#FFFFFF"/>

  <!-- 鼻子 -->
  <path d="M30 41 L34 41 L32 43 Z" fill="#FF8FA3" stroke="#E66B82" stroke-width="0.5" stroke-linejoin="round"/>

  <!-- 嘴巴 -->
  <path d="M32 43 Q30 45.5 28.5 45" stroke="#5C3A2E" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M32 43 Q34 45.5 35.5 45" stroke="#5C3A2E" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- 左边胡须 -->
  <line x1="20" y1="42" x2="12" y2="40" stroke="#8B6F47" stroke-width="1" stroke-linecap="round"/>
  <line x1="20" y1="44" x2="12" y2="44" stroke="#8B6F47" stroke-width="1" stroke-linecap="round"/>
  <line x1="20" y1="46" x2="12" y2="48" stroke="#8B6F47" stroke-width="1" stroke-linecap="round"/>

  <!-- 右边胡须 -->
  <line x1="44" y1="42" x2="52" y2="40" stroke="#8B6F47" stroke-width="1" stroke-linecap="round"/>
  <line x1="44" y1="44" x2="52" y2="44" stroke="#8B6F47" stroke-width="1" stroke-linecap="round"/>
  <line x1="44" y1="46" x2="52" y2="48" stroke="#8B6F47" stroke-width="1" stroke-linecap="round"/>

  <!-- 腮红 -->
  <ellipse cx="22" cy="42" rx="2.5" ry="1.5" fill="#FFB6B0" opacity="0.7"/>
  <ellipse cx="42" cy="42" rx="2.5" ry="1.5" fill="#FFB6B0" opacity="0.7"/>
</svg>
